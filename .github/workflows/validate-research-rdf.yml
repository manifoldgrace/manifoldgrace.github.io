name: Validate research RDF (synthetic fixtures)

on:
  push:
    paths:
      - "ontology/**"
      - "tests/fixtures/mg-evidence-*.ttl"
      - "scripts/validate_research_graph.py"
      - ".github/workflows/validate-research-rdf.yml"
  pull_request:
    paths:
      - "ontology/**"
      - "tests/fixtures/mg-evidence-*.ttl"
      - "scripts/validate_research_graph.py"
      - ".github/workflows/validate-research-rdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install RDF validators
        run: python -m pip install "rdflib>=7,<9" "pyshacl>=0.27,<1"
      - name: Validate synthetic RDF fixtures
        run: python scripts/validate_research_graph.py
