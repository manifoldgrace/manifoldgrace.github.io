name: Validate AI taxonomy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-taxonomy:
    name: Taxonomy schema and provenance gates
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate taxonomy records and source baseline
        run: python scripts/validate_ai_taxonomy.py
