name: Update Global News metadata
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-news-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh GDELT indexed headlines
        run: python scripts/update_news_headlines.py
      - name: Commit data snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news-headlines.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh attributed Global News index snapshot"
            git push
          fi
