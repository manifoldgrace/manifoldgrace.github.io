name: Update Global News metadata
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: global-news-metadata
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh GDELT indexed headlines
        run: python scripts/update_news_headlines.py
      - name: Commit data snapshot if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/news-headlines.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh attributed Global News index snapshot"
            # Concurrent website commits can advance main during a scheduled refresh.
            # Replay only this data change on the latest main, then retry a bounded push.
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase origin/main
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Main advanced during news refresh; retrying ($attempt/3)"
              sleep 3
            done
            echo "::error::Unable to publish news snapshot after three reconciled attempts"
            exit 1
          fi
