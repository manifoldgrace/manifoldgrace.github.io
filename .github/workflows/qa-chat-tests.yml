name: AI chat gateway tests
on:
  push:
    paths:
      - 'qa-platform/chat-backend/**'
      - '.github/workflows/qa-chat-tests.yml'
  pull_request:
    paths:
      - 'qa-platform/chat-backend/**'
      - '.github/workflows/qa-chat-tests.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qa-platform/chat-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run mocked model API and authentication tests
        run: npm test
