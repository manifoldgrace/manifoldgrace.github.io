name: Bloomberg AI metadata research index
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */2 * * *'
permissions:
  contents: write
concurrency:
  group: bloomberg-ai-metadata
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect permitted RSS metadata
        run: python scripts/update_bloomberg_ai_index.py
      - name: Commit updated index only when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/bloomberg-ai-index.json
          if ! git diff --cached --quiet; then
            git commit -m "Update timestamped Bloomberg AI RSS metadata index"
            git push
          fi
