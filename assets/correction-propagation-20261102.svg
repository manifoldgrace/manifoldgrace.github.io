<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="3. Correction &amp; Propagation Workflow"><rect width="1200" height="520" fill="#f8fafc"/><text x="45" y="57" font-size="29" font-weight="700" fill="#0f2742">3. Correction &amp; Propagation Workflow</text><text x="45" y="90" font-size="17" fill="#52657a">Versioned challenges and updates to authorised downstream AI systems.</text><rect x="45" y="133" rx="12" width="207.6" height="300" fill="#ffffff" stroke="#8ca6c4" stroke-width="2"/><rect x="45" y="133" rx="12" width="207.6" height="64" fill="#dceafb"/><text x="62" y="172" font-size="19" font-weight="700" fill="#12365b">1. Record</text><text x="62" y="226" font-size="16" fill="#213a55">Publish v1</text><text x="62" y="260" font-size="16" fill="#213a55">Claim + evidence</text><text x="62" y="294" font-size="16" fill="#213a55">Record provenance</text><path d="M254.6 285 h12 m-7 -6 l7 6 -7 6" stroke="#1261a0" stroke-width="2" fill="none"/><rect x="270.6" y="133" rx="12" width="207.6" height="300" fill="#ffffff" stroke="#8ca6c4" stroke-width="2"/><rect x="270.6" y="133" rx="12" width="207.6" height="64" fill="#dceafb"/><text x="287.6" y="172" font-size="19" font-weight="700" fill="#12365b">2. Challenge</text><text x="287.6" y="226" font-size="16" fill="#213a55">Receive new evidence</text><text x="287.6" y="260" font-size="16" fill="#213a55">Check permission</text><text x="287.6" y="294" font-size="16" fill="#213a55">Mark contested</text><path d="M480.20000000000005 285 h12 m-7 -6 l7 6 -7 6" stroke="#1261a0" stroke-width="2" fill="none"/><rect x="496.2" y="133" rx="12" width="207.6" height="300" fill="#ffffff" stroke="#8ca6c4" stroke-width="2"/><rect x="496.2" y="133" rx="12" width="207.6" height="64" fill="#dceafb"/><text x="513.2" y="172" font-size="19" font-weight="700" fill="#12365b">3. Review</text><text x="513.2" y="226" font-size="16" fill="#213a55">Reassess sources</text><text x="513.2" y="260" font-size="16" fill="#213a55">Human oversight</text><text x="513.2" y="294" font-size="16" fill="#213a55">Record outcome</text><path d="M705.8 285 h12 m-7 -6 l7 6 -7 6" stroke="#1261a0" stroke-width="2" fill="none"/><rect x="721.8" y="133" rx="12" width="207.6" height="300" fill="#ffffff" stroke="#8ca6c4" stroke-width="2"/><rect x="721.8" y="133" rx="12" width="207.6" height="64" fill="#dceafb"/><text x="738.8" y="172" font-size="19" font-weight="700" fill="#12365b">4. Revise</text><text x="738.8" y="226" font-size="16" fill="#213a55">Create version v2</text><text x="738.8" y="260" font-size="16" fill="#213a55">Retain audit trail</text><text x="738.8" y="294" font-size="16" fill="#213a55">Publish change log</text><path d="M931.4 285 h12 m-7 -6 l7 6 -7 6" stroke="#1261a0" stroke-width="2" fill="none"/><rect x="947.4" y="133" rx="12" width="207.6" height="300" fill="#ffffff" stroke="#8ca6c4" stroke-width="2"/><rect x="947.4" y="133" rx="12" width="207.6" height="64" fill="#dceafb"/><text x="964.4" y="172" font-size="19" font-weight="700" fill="#12365b">5. Notify</text><text x="964.4" y="226" font-size="16" fill="#213a55">Webhook / event bus</text><text x="964.4" y="260" font-size="16" fill="#213a55">Subscriber refresh</text><text x="964.4" y="294" font-size="16" fill="#213a55">Acknowledgement</text><rect x="45" y="455" rx="8" width="1110" height="43" fill="#e5eef9"/><text x="65" y="483" font-size="17" font-weight="600" fill="#193858">Downstream systems update only where authorised; disputed and unresolved records remain distinguishable.</text></svg>