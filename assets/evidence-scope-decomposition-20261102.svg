<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="1. Evidential Scope Decomposition"><rect width="1200" height="520" fill="#f8fafc"/><text x="45" y="57" font-size="29" font-weight="700" fill="#0f2742">1. Evidential Scope Decomposition</text><text x="45" y="90" font-size="17" fill="#52657a">From one broad citation to independently assessed sub-claims.</text><rect x="45" y="133" rx="12" width="264" height="300" fill="#ffffff" stroke="#8ca6c4" stroke-width="2"/><rect x="45" y="133" rx="12" width="264" height="64" fill="#dceafb"/><text x="62" y="172" font-size="19" font-weight="700" fill="#12365b">Current citation</text><text x="62" y="226" font-size="16" fill="#213a55">Composite sentence</text><text x="62" y="260" font-size="16" fill="#213a55">Single citation</text><text x="62" y="294" font-size="16" fill="#213a55">Unclear support scope</text><path d="M311 285 h12 m-7 -6 l7 6 -7 6" stroke="#1261a0" stroke-width="2" fill="none"/><rect x="327" y="133" rx="12" width="264" height="300" fill="#ffffff" stroke="#8ca6c4" stroke-width="2"/><rect x="327" y="133" rx="12" width="264" height="64" fill="#dceafb"/><text x="344" y="172" font-size="19" font-weight="700" fill="#12365b">Decompose</text><text x="344" y="226" font-size="16" fill="#213a55">Claim A</text><text x="344" y="260" font-size="16" fill="#213a55">Claim B</text><text x="344" y="294" font-size="16" fill="#213a55">Claim C</text><text x="344" y="328" font-size="16" fill="#213a55">Claim D</text><path d="M593 285 h12 m-7 -6 l7 6 -7 6" stroke="#1261a0" stroke-width="2" fill="none"/><rect x="609" y="133" rx="12" width="264" height="300" fill="#ffffff" stroke="#8ca6c4" stroke-width="2"/><rect x="609" y="133" rx="12" width="264" height="64" fill="#dceafb"/><text x="626" y="172" font-size="19" font-weight="700" fill="#12365b">Verify per claim</text><text x="626" y="226" font-size="16" fill="#213a55">Supporting source span</text><text x="626" y="260" font-size="16" fill="#213a55">Contradicting evidence</text><text x="626" y="294" font-size="16" fill="#213a55">Publisher metadata</text><text x="626" y="328" font-size="16" fill="#213a55">Status per sub-claim</text><path d="M875 285 h12 m-7 -6 l7 6 -7 6" stroke="#1261a0" stroke-width="2" fill="none"/><rect x="891" y="133" rx="12" width="264" height="300" fill="#ffffff" stroke="#8ca6c4" stroke-width="2"/><rect x="891" y="133" rx="12" width="264" height="64" fill="#dceafb"/><text x="908" y="172" font-size="19" font-weight="700" fill="#12365b">Result</text><text x="908" y="226" font-size="16" fill="#213a55">Supported</text><text x="908" y="260" font-size="16" fill="#213a55">Partially supported</text><text x="908" y="294" font-size="16" fill="#213a55">Disputed</text><text x="908" y="328" font-size="16" fill="#213a55">Unestablished</text><rect x="45" y="455" rx="8" width="1110" height="43" fill="#e5eef9"/><text x="65" y="483" font-size="17" font-weight="600" fill="#193858">No status is inferred from a citation alone; each proposition requires evidence.</text></svg>